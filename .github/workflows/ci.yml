name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        run: pip install numpy
      - name: Syntax check
        run: python -m compileall -q main.py core data tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
